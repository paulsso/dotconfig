general {
    # Avoid spawning multiple lock instances
    lock_cmd = pidof hyprlock || hyprlock       
    # Fire DBus lock signal immediately before the system drops to disk
    before_sleep_cmd = loginctl lock-session    
    # Ensure display turns back on gracefully post-resume
    after_sleep_cmd = hyprctl dispatch dpms on  
}

# Optional: Auto-lock after 10 minutes of complete inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Optional: Drop to system hibernation after 30 minutes of inactivity
listener {
    timeout = 1800
    on-timeout = systemctl hibernate
}
