splash = false
# Bind Zen Browser to workspace 2
windowrulev2 = workspace 2, class:^(zen)$

# Bind Steam to workspace 3
windowrulev2 = workspace 3, class:^(steam)$
# Export Wayland and Hyprland environment variables to D-Bus and systemd
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Optionally start the portal daemon cleanly on startup
exec-once = systemctl --user restart xdg-desktop-portal

input {
    # Define both Swedish and US English layouts
    kb_layout = se,us
    
    # Internal XKB fallback toggle option
    kb_options = grp:win_space_toggle
}

# Explicit custom binding to toggle layouts across all connected keyboards
bind = SUPER SHIFT, space, exec, hyprctl switchxkblayout all next
