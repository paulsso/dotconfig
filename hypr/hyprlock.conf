# Clean "Display Manager" Emulation for Hyprlock
bg_base = rgba(16, 15, 15, 1.0)      # Flexoki Dark Base
fg_text = rgba(242, 240, 229, 1.0)    # Flexoki Warm Paper
accent  = rgba(32, 94, 166, 1.0)     # Flexoki Blue-600

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/arch-linux-2024-6f-3440x1440.jpg  # Point directly to your SDDM background asset
    color = $bg_base
    blur_passes = 3                  # Subtle blur for a premium UI feel
    blur_size = 5
}


# Welcome Text / Username Field
label {
    monitor =
    text = cmd[update:1000] echo "Welcome back, $USER"
    color = $fg_text
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# The Login Password Input Field
input-field {
    monitor =
    size = 280, 45
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    
    outer_color = $accent
    inner_color = rgba(40, 39, 38, 0.8) # Flexoki base-900 (Translucent Input block)
    font_color = $fg_text
    
    fade_on_empty = false
    placeholder_text = Enter Password...
    hide_input = false
    
    position = 0, -40
    halign = center
    valign = center
}

# Clock Display (Top Right or Center Top)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $fg_text
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 260
    halign = center
    valign = center
}
