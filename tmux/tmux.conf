# ==========================================
# Vim-Style Pane Resizing
# ==========================================

# Resize panes by 5 columns/rows at a time
# The '-r' flag makes the command repeatable so you don't have to keep hitting the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
